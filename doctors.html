<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MediConnect - consult qualified doctors online from home.">
    <title>Our Doctors | MediConnect</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/doctors.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <a href="#main" class="skip-link">Skip to main content</a>

    <nav class="navbar" aria-label="Main navigation">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fas fa-heart-pulse" aria-hidden="true"></i> MediConnect</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#how">How It Works</a></li>
                <li><a href="doctors.html" class="active">Doctors</a></li>
                <li><a href="book.html">Book</a></li>
                <li><a href="appointments.html">My Appointments</a></li>
                <li><a href="faq.html">FAQ</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="nav-links">
                <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
        </div>
    </nav>

    <main id="main">

        <section id="doctors" class="section page-top bg-light">
            <div class="container">
                <div class="section-header">
                    <h2 class="text-center">Our Doctors</h2>
                    <label for="doctor-search" class="sr-only">Search doctors by name</label>
                    <input type="search" id="doctor-search" class="search-box" placeholder="Search doctor by name...">
                    <div class="filters" role="group" aria-label="Filter by specialty">
                        <button class="filter-btn active" data-filter="all" aria-pressed="true">All</button>
                        <button class="filter-btn" data-filter="General" aria-pressed="false">General</button>
                        <button class="filter-btn" data-filter="Cardiology" aria-pressed="false">Cardiology</button>
                        <button class="filter-btn" data-filter="Dermatology" aria-pressed="false">Dermatology</button>
                        <button class="filter-btn" data-filter="Paediatrics" aria-pressed="false">Paediatrics</button>
                    </div>
                </div>
                <div class="card-grid" id="doctor-container" aria-live="polite"></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2026 MediConnect Telemedicine Platform. Prototype for academic purposes.</p>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite">Action Successful!</div>

    <script src="js/common.js"></script>
    <script src="js/doctors.js"></script>
</body>
</html>
